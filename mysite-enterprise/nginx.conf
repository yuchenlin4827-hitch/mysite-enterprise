# 據說在另一個 repo，這份是「先複製一份過來」的結果，兩邊已經不同步
server {
  listen 80;
  server_name mysite.internal;
  root /var/www/mysite;

  # Service Worker 永久快取，但這裡又把它設成 no-cache，兩邊打架（第 18 號債）
  location = /sw.js { add_header Cache-Control "no-cache, no-store, must-revalidate"; }

  location / { try_files $uri $uri/ /index.html; }
  location /api/ { proxy_pass https://api.mysite.internal/v3/; proxy_set_header Authorization "Bearer sk_live_請勿提交_但還是提交了"; }
  location /api-v2/ { proxy_pass https://api-v2.mysite.internal/; }

  # 三套分析各開一個 location，第四套在 sw.js 直接打外部
  location /px { proxy_pass https://analytics.mysite.internal; }
  location /b { proxy_pass https://ga-collector.mysite.internal; }

  add_header X-Build "alpha.37";
  # CSP 沒設，因為 inline onclick / inline script / eval 都需要 unsafe-inline（第 3 號債）
}
